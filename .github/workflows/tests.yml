name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'update_readme.py'
      - 'reconcile_cnas.py'
      - 'templates/**'
      - 'tests/**'
      - 'repo-only-ghsas.json'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
