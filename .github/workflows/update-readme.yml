name: Update README

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'update_readme.py'
      - 'reconcile_cnas.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean generated files
        run: rm -rf README.md ADVISORIES.md cves.json cve-pipeline-status.json ghsa-advisories.json
        # Note: cve-records/, ghsa-advisories-full.json, and repo-only-ghsas.json
        # are kept as cache fallbacks when APIs fail or are rate-limited.

      - name: Cache cvelistV5 sparse checkout
        uses: actions/cache@v4
        with:
          path: .cvelistV5
          # Date-keyed so the sparse checkout is refreshed (and re-cloned) daily;
          # reconcile_cnas.py also git-pulls an existing checkout each run.
          key: cvelistV5-${{ github.run_id }}
          restore-keys: |
            cvelistV5-

      - name: Reconcile CVE List V5 (all CNAs)
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 reconcile_cnas.py

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 update_readme.py

      - name: Check for changes
        id: changes
        run: |
          git status --porcelain README.md ADVISORIES.md cves.json ghsa-advisories.json cve-pipeline-status.json repo-only-ghsas.json cve-records/ openclaw-cves-all.json cna-breakdown.json | grep -q . && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ADVISORIES.md ghsa-advisories.json ghsa-advisories-full.json cves.json cve-records/ cve-pipeline-status.json repo-only-ghsas.json openclaw-cves-all.json cna-breakdown.json
          git commit -m "chore: update CVE/GHSA tracker [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
